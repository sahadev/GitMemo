<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitMemo — Editorial Tech prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─── Tokens (mirrors desktop/src/index.css) ───────────────── */
:root{
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;

  --bg:#1A1817;
  --card:#252220;
  --hover:#302C2C;
  --input:#252220;
  --text:#FDFCFC;
  --text-2:#9A9898;
  --muted:#7C7978;
  --accent:#007AFF;
  --accent-hover:#0056B3;
  --accent-soft:rgba(0,122,255,.14);
  --border:rgba(253,252,252,.08);
  --border-strong:rgba(253,252,252,.22);
  --green:#30D158;
  --yellow:#FF9F0A;
  --red:#FF453A;
  --code-bg:#1F1D1C;
  --shadow:0 10px 30px rgba(0,0,0,.45);

  --r1:4px; --r2:6px; --r3:8px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F7F4F2;
  --card:#FDFCFB;
  --hover:#EEEBE8;
  --input:#FDFCFB;
  --text:#201D1D;
  --text-2:#7A7574;
  --muted:#96918F;
  --accent:#007AFF;
  --accent-hover:#0056B3;
  --accent-soft:rgba(0,122,255,.10);
  --border:rgba(15,0,0,.10);
  --border-strong:rgba(15,0,0,.26);
  --green:#248A3D;
  --yellow:#C46200;
  --red:#D70015;
  --code-bg:#F2EFEC;
  --shadow:0 10px 26px rgba(40,30,25,.14);
  color-scheme:light;
}

/* ─── Base ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-mono);font-size:12px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--accent-soft);color:var(--text)}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
.lucide{width:14px;height:14px;stroke-width:1.7;flex:none}
.sans{font-family:var(--font-sans)}
.mut{color:var(--muted)}
.t2{color:var(--text-2)}
.link{color:var(--accent);cursor:pointer;background:none;border:0;font:inherit;padding:0}
.link:hover{text-decoration:underline}
kbd{
  font-family:var(--font-mono);font-size:9.5px;line-height:1;padding:2px 4px;
  border:1px solid var(--border);border-radius:3px;color:var(--muted);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border:3px solid transparent;background-clip:content-box;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ─── Shell ────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100vh}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* sidebar */
.sb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);padding:10px 8px 8px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 12px}
.brand__mark{
  width:18px;height:18px;border-radius:var(--r1);background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:-.04em;
}
.brand__name{font-size:12.5px;font-weight:500;letter-spacing:-.01em}
.brand__ver{font-size:9px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav__label{padding:10px 8px 4px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav__item{
  display:flex;align-items:center;gap:8px;height:27px;padding:0 8px;
  border:0;border-radius:var(--r1);background:none;color:var(--text-2);
  font-size:11.5px;text-align:left;cursor:pointer;width:100%;
  transition:background .14s,color .14s;
}
.nav__item:hover{background:var(--hover);color:var(--text)}
.nav__item:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.nav__item.is-on{background:var(--accent-soft);color:var(--accent)}
.nav__item .n{margin-left:auto;font-size:9.5px;color:var(--muted)}
.nav__item.is-on .n{color:var(--accent)}
.sb__foot{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
.repo{padding:4px 8px;display:flex;flex-direction:column;gap:3px}
.repo__r{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-2)}
.repo__r .v{margin-left:auto;color:var(--text)}
.repo__r .warn{color:var(--yellow)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--text-2);flex:none}
.dot--ok{background:var(--green)}
.dot--warn{background:var(--yellow)}
.dot--err{background:var(--red)}
.dot--accent{background:var(--accent)}

/* toolbar */
.tb{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);min-width:0;white-space:nowrap}
.crumbs b{color:var(--text-2);font-weight:400}
.tb__right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;width:230px;
  border:1px solid var(--border);border-radius:var(--r2);background:var(--input);color:var(--muted);
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:11.5px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.iconbtn{
  width:26px;height:26px;display:grid;place-items:center;border:1px solid transparent;
  border-radius:var(--r2);background:none;color:var(--text-2);cursor:pointer;
  transition:background .14s,color .14s,border-color .14s;
}
.iconbtn:hover{background:var(--hover);color:var(--text);border-color:var(--border)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;
  border:1px solid var(--border);border-radius:var(--r2);background:none;color:var(--text);
  font-size:11.5px;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:var(--hover);border-color:var(--border-strong)}
.btn:active{transform:translateY(.5px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn--primary{background:var(--accent);border-color:transparent;color:#fff}
.btn--primary:hover{background:var(--accent-hover)}
.btn--quiet{border-color:transparent;color:var(--text-2)}
.btn--quiet:hover{color:var(--text)}
.btn--sm{height:22px;padding:0 7px;font-size:10.5px;border-radius:var(--r1)}
.btn .lucide{width:12px;height:12px}

/* status bar */
.sbar{
  height:22px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;
  border-top:1px solid var(--border);font-size:9.5px;color:var(--muted);
}
.sbar .sep{opacity:.4}

/* ─── Views ────────────────────────────────────────────────── */
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.vh{display:flex;align-items:center;gap:12px;padding:13px 16px 12px;border-bottom:1px solid var(--border);flex:none}
.vh h1{font-family:var(--font-sans);font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.2}
.vh .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.vh__a{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}

/* split panes */
.panes{display:grid;grid-template-columns:336px minmax(0,1fr);flex:1;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:auto}
.pane + .pane{border-left:1px solid var(--border)}
.pane__h{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--border);
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.pane__h .spacer{margin-left:auto}
.pane__body{padding:0}
.detail{padding:16px;min-width:0}

/* rows */
.row{
  display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;
}
.row:hover{background:var(--hover)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row.is-sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.row__i{color:var(--muted);display:flex}
.row.is-sel .row__i{color:var(--accent)}
.row__t{font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__m{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row__r{text-align:right;font-size:9.5px;color:var(--muted);white-space:nowrap}
.row > span:nth-child(2){min-width:0;display:block;overflow:hidden}

/* tags */
.tag{
  display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 4px;
  border:1px solid var(--border);border-radius:3px;
  font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);
}
.tag--blue{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.tag--green{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.tag--yellow{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.tag--red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}

/* ─── Dashboard ────────────────────────────────────────────── */
.dash{overflow:auto;padding:14px 16px 20px;flex:1;min-height:0}
.strip{
  display:flex;flex-wrap:wrap;align-items:stretch;margin-bottom:14px;
  border:1px solid var(--border);border-radius:var(--r3);background:var(--card);overflow:hidden;
}
.strip__c{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:10.5px;color:var(--text-2)}
.strip__c + .strip__c{border-left:1px solid var(--border)}
.strip__c b{color:var(--text);font-weight:500}
.strip__c .warn{color:var(--yellow)}
.strip__c .ok{color:var(--green)}
.dash__grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,.8fr);gap:16px;align-items:start}
.sec{margin-bottom:16px}
.sec__h{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.sec__h::after{content:'';flex:1;height:1px;background:var(--border)}
.sec__h .link{text-transform:none;letter-spacing:0;font-size:10px}
.list{border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;background:var(--card)}
.list .row:last-child{border-bottom:0}

/* log */
.log{border:1px solid var(--border);border-radius:var(--r3);background:var(--card);overflow:hidden}
.log__r{display:grid;grid-template-columns:42px 8px minmax(0,1fr);gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);font-size:10.5px;color:var(--text-2)}
.log__r:last-child{border-bottom:0}
.log__t{color:var(--muted);font-variant-numeric:tabular-nums}
.log__r b{color:var(--text);font-weight:400}
.log__r .warn{color:var(--yellow)}
.log__r .err{color:var(--red)}
.log__r .ok{color:var(--green)}
.log__r .d{margin-top:5px}

/* quick actions */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden}
.qa__b{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:9px 10px;border:0;background:var(--card);color:var(--text-2);
  font-size:11px;text-align:left;cursor:pointer;transition:background .14s,color .14s;
}
.qa__b:hover{background:var(--hover);color:var(--text)}
.qa__b .lucide{width:13px;height:13px;color:var(--muted)}
.qa__b:hover .lucide{color:var(--accent)}
.qa__b .k{font-size:9px;color:var(--muted)}

/* kv table */
.kv{border:1px solid var(--border);border-radius:var(--r3);background:var(--card);overflow:hidden}
.kv__r{display:flex;align-items:center;gap:12px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px}
.kv__r:last-child{border-bottom:0}
.kv__k{color:var(--text-2)}
.kv__v{margin-left:auto;font-size:10.5px;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv__v.num{font-variant-numeric:tabular-nums}

/* ─── Detail ───────────────────────────────────────────────── */
.dt__title{font-family:var(--font-sans);font-size:16px;font-weight:600;letter-spacing:-.012em;margin:0 0 5px;line-height:1.35}
.dt__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.dt__acts{display:flex;gap:6px;margin:12px 0 14px;flex-wrap:wrap}
.snippet{
  border:1px solid var(--border);border-radius:var(--r2);background:var(--card);
  padding:10px 12px;font-size:11px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;overflow:auto;max-width:86ch;
}
.dt__sec{margin-top:16px}
.dt__sh{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* markdown */
.md{font-family:var(--font-sans);font-size:14px;line-height:1.75;color:var(--text);max-width:74ch}
.md h1{font-size:24px;font-weight:600;letter-spacing:-.022em;margin:0 0 12px;line-height:1.25}
.md h2{font-size:17px;font-weight:600;letter-spacing:-.012em;margin:22px 0 8px}
.md h3{font-size:14.5px;font-weight:600;margin:18px 0 6px}
.md p{margin:0 0 12px;color:color-mix(in srgb,var(--text) 90%,transparent)}
.md ul,.md ol{margin:0 0 12px;padding-left:18px}
.md li{margin:3px 0;color:color-mix(in srgb,var(--text) 90%,transparent)}
.md code{font-family:var(--font-mono);font-size:12px;background:var(--hover);padding:1px 4px;border-radius:3px}
.md pre{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;overflow:auto;margin:0 0 14px}
.md pre code{background:none;padding:0;font-size:11.5px;line-height:1.65;color:var(--text-2)}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 12px;border-left:2px solid var(--border-strong);color:var(--text-2)}
.md table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:12.5px}
.md th,.md td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.md th{color:var(--text-2);font-weight:500;background:var(--card)}
.md hr{border:0;border-top:1px solid var(--border);margin:18px 0}

/* editor */
.editor{display:flex;flex-direction:column;flex:1;min-height:0}
.editor__bar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.editor__bar .path{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor__body{flex:1;overflow:auto;padding:22px 26px 60px;min-height:0}
.editor__ta{
  width:100%;max-width:74ch;min-height:60vh;border:0;outline:0;resize:none;background:none;
  font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--text);
}
.editor__foot{
  display:flex;align-items:center;gap:10px;padding:4px 12px;border-top:1px solid var(--border);
  font-size:9.5px;color:var(--muted);flex:none;
}
.toolbtn{
  width:22px;height:22px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r1);
  background:none;color:var(--text-2);cursor:pointer;
}
.toolbtn:hover{background:var(--hover);color:var(--text);border-color:var(--border)}
.toolbtn .lucide{width:12px;height:12px}

/* transcript */
.turn{border-left:2px solid var(--border);padding:1px 0 1px 10px;margin-bottom:12px}
.turn--user{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.turn__role{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.turn__body{font-size:11.5px;line-height:1.7;color:var(--text-2);white-space:pre-wrap}
.turn__body.md{font-family:var(--font-mono);font-size:11.5px;line-height:1.7;white-space:normal}
.turn__body.md p{margin:0 0 8px}
.turn__body.md pre{margin:0 0 8px}
.turn__body.md code{font-size:11px}

/* empty / error */
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:11px}
.empty .lucide{width:18px;height:18px;margin-bottom:8px;color:var(--border-strong)}
.empty p{margin:0 0 4px}
.errorbox{margin:16px;border:1px solid color-mix(in srgb,var(--red) 38%,transparent);background:color-mix(in srgb,var(--red) 7%,transparent);border-radius:var(--r2);padding:12px 14px}
.errorbox__t{display:flex;align-items:center;gap:6px;color:var(--red);font-size:11.5px}
.errorbox p{margin:7px 0 0;font-size:10.5px;line-height:1.65;color:var(--text-2)}
.errorbox code{font-family:var(--font-mono);font-size:10.5px;color:var(--text)}

/* ─── Settings ─────────────────────────────────────────────── */
.settings{display:grid;grid-template-columns:186px minmax(0,1fr);flex:1;min-height:0}
.snav{padding:8px;border-right:1px solid var(--border);overflow:auto}
.snav__i{
  display:block;width:100%;text-align:left;border:0;background:none;font-family:inherit;
  font-size:11px;color:var(--text-2);padding:5px 8px;border-radius:var(--r1);cursor:pointer;
  transition:background .13s,color .13s;
}
.snav__i:hover{background:var(--hover);color:var(--text)}
.snav__i.is-on{background:var(--accent-soft);color:var(--accent)}
.snav__i:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.sform{overflow:auto;padding:14px 16px 32px}
.sform__h{font-family:var(--font-sans);font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 2px}
.sform__s{font-size:10.5px;color:var(--muted);margin-bottom:12px}
.frow{display:flex;align-items:center;gap:16px;padding:9px 10px;border-bottom:1px solid var(--border)}
.frow:first-of-type{border-top:1px solid var(--border)}
.frow__l{font-size:11.5px;color:var(--text)}
.frow__h{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.55;max-width:58ch}
.frow__c{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.fval{font-size:10.5px;color:var(--text-2);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{
  width:28px;height:16px;border-radius:9px;border:1px solid var(--border);background:var(--hover);
  position:relative;cursor:pointer;transition:background .16s,border-color .16s;padding:0;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;
  background:var(--text-2);transition:transform .16s,background .16s;
}
.switch.is-on{background:color-mix(in srgb,var(--accent) 26%,transparent);border-color:var(--accent)}
.switch.is-on::after{transform:translateX(12px);background:var(--accent)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--r1);overflow:hidden}
.seg button{height:22px;padding:0 8px;border:0;background:none;font-family:inherit;font-size:10.5px;color:var(--text-2);cursor:pointer}
.seg button + button{border-left:1px solid var(--border)}
.seg button.is-on{background:var(--accent-soft);color:var(--accent)}
.input{
  height:24px;padding:0 7px;border:1px solid var(--border);border-radius:var(--r1);
  background:var(--input);font-size:11px;outline:0;min-width:0;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.keys{border:1px solid var(--border);border-radius:var(--r3);overflow:hidden}
.keys__r{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-2)}
.keys__r:last-child{border-bottom:0}
.keys__r .k{margin-left:auto;display:flex;gap:4px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,8px);
  display:flex;align-items:center;gap:7px;padding:7px 12px;z-index:60;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r2);
  box-shadow:var(--shadow);font-size:11px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast .lucide{width:12px;height:12px;color:var(--green)}

/* ─── Responsive ───────────────────────────────────────────── */
@media (max-width:1180px){
  #app{grid-template-columns:188px minmax(0,1fr)}
  .dash__grid{grid-template-columns:minmax(0,1fr)}
  .panes{grid-template-columns:300px minmax(0,1fr)}
  .search{width:180px}
}
@media (max-width:900px){
  #app{grid-template-columns:52px minmax(0,1fr)}
  .sb{padding:8px 6px;align-items:center}
  .brand{padding:2px 0 10px;gap:0}
  .brand__text,.nav__label,.nav__item span,.sb__foot{display:none}
  .nav__item{justify-content:center;padding:0}
  .search{width:150px}
  .crumbs{display:none}
  .settings{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .snav{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px}
  .snav__i{white-space:nowrap;padding:4px 7px}
  .vh{flex-wrap:wrap}
}
@media (max-width:740px){
  .panes{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,45%) minmax(0,1fr)}
  .pane + .pane{border-left:0;border-top:1px solid var(--border)}
  .editor__body{padding:16px 16px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  'Local captures arrive as commits on `main`. When the remote has moved, the working copy can diverge within a single session — usually right after a long agent run.',

  '## Decision',
  '',
  '> Rebase local capture commits onto the remote tip. Never merge capture commits into a shared branch.',
  '',
  'Reasons, in order of weight:',
  '',
  '1. Capture commits are linear by construction — one writer, one machine.',
  '2. A merge commit on a knowledge repo hides the actual change in history.',
  '3. Conflicts are almost always in generated index files, which can be re-derived.',
  '',
  '## Implementation',
  '',
  '```bash',
  'git fetch --all --prune',
  'git rebase --autostash --rebase-merges origin/main',
  '# index files are rebuilt from the tree after a successful rebase',

  '```',
  '',
  'The worker retries up to three times with exponential backoff. If the tree is still dirty after the third attempt, it stops and surfaces the conflict in the dashboard instead of guessing.',

  '## Edge cases',

  '| --- | --- |',

/* ───────────────────────── markdown ───────────────────────── */
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}
function mdToHtml(src){
  const lines = String(src).split('\n');
  let out = '', i = 0, inCode = false, code = [], list = null;

  const closeList = () => { if (list) { out += '</' + list + '>'; list = null; } };

  while (i < lines.length){
    const L0 = lines[i];

    if (/^```/.test(L0)){
      if (inCode){ out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = []; inCode = false; }
      else inCode = true;
      i++; continue;
    }
    if (inCode){ code.push(L0); i++; continue; }

    if (/^\s*$/.test(L0)){ closeList(); i++; continue; }

    let m;
    if ((m = L0.match(/^(#{1,3})\s+(.*)$/))){
      closeList();
      const n = m[1].length;
      out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>';
      i++; continue;
    }
    if (/^---\s*$/.test(L0)){ closeList(); out += '<hr>'; i++; continue; }
    if ((m = L0.match(/^>\s?(.*)$/))){ closeList(); out += '<blockquote>' + inline(m[1]) + '</blockquote>'; i++; continue; }
    if ((m = L0.match(/^[-*]\s+(.*)$/))){
      if (list !== 'ul'){ closeList(); out += '<ul>'; list = 'ul'; }
      out += '<li>' + inline(m[1]) + '</li>'; i++; continue;
    }
    if ((m = L0.match(/^\d+\.\s+(.*)$/))){
      if (list !== 'ol'){ closeList(); out += '<ol>'; list = 'ol'; }
      out += '<li>' + inline(m[1]) + '</li>'; i++; continue;
    }
    if (/\|/.test(L0) && lines[i+1] && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      closeList();
      const head = L0.split('|').map(s => s.trim()).filter(Boolean);
      i += 2;
      const rows = [];
      while (i < lines.length && /\|/.test(lines[i])){
        rows.push(lines[i].split('|').map(s => s.trim()).filter(Boolean)); i++;
      }
      out += '<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      continue;
    }

    closeList();
    const para = [L0]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|```|>|[-*]\s|\d+\.\s|---\s*$)/.test(lines[i])) { para.push(lines[i]); i++; }
    out += '<p>' + inline(para.join(' ')) + '</p>';
  }
  closeList();
  if (inCode) out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>';
  return out;
}

    if (state.filter !== 'all' && e.kind !== state.filter) return false;
    if (!q) return true;
    return (e.title + ' ' + e.meta + ' ' + e.path).toLowerCase().indexOf(q) > -1;

      '<div class="pane"><div class="pane__h">' +
        '<span>' + results.length + ' ' + t('search.results') + '</span>' +
        '<span class="spacer"></span><span>' + t('search.sort') + ': ' + t('search.byRecent') + '</span>' +
      '</div>' +
        (results.length ? rows :
          '<div class="empty">' + icon('search-x') + '<p>' + t('search.empty') + '</p><p>' + t('search.emptyHint') + '</p></div>') +
        '<div class="pane__h" style="border-top:1px solid var(--border);border-bottom:0;position:static;margin-top:auto">' +
          t('search.hint') + '</div>' +
      '</div>' +
      '<div class="pane">' + resultDetailHTML(sel) + '</div>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── notes ───────────────────────── */
function notesHTML(){
  const note = NOTES.filter(n => n.id === state.noteId)[0] || NOTES[0];
  const rows = NOTES.map(n =>
    '<button class="row ' + (n.id === note.id ? 'is-sel' : '') + '" data-note="' + n.id + '">' +
      '<span class="row__i">' + icon('file-text') + '</span>' +
      '<span><span class="row__t">' + esc(n.title) + '</span>' +
        '<span class="row__m">' + esc(n.path) + '</span></span>' +
      '<span class="row__r">' + n.updated + '</span>' +
    '</button>').join('');

  const draft = state.noteDraft[note.id] !== undefined ? state.noteDraft[note.id] : note.md;
  const words = draft.split(/\s+/).filter(Boolean).length;

  return '<div class="view">' +
    '<div class="vh"><div><h1>' + t('notes.title') + '</h1><div class="sub">' + t('notes.sub') + '</div></div>' +
      '<div class="vh__a"><button class="btn btn--primary" data-act="note">' + icon('file-plus') + t('quick.note') + '</button></div></div>' +
    '<div class="panes" style="grid-template-columns:264px minmax(0,1fr)">' +
      '<div class="pane"><div class="pane__h"><span>' + NOTES.length + ' ' + t('notes.title').toLowerCase() + '</span></div>' + rows + '</div>' +
      '<div class="pane editor">' +
        '<div class="editor__bar">' +
          '<span class="path">' + esc(note.path) + '</span>' +
          '<span class="spacer" style="margin-left:auto"></span>' +
          '<div class="seg">' +
            '<button class="' + (state.noteMode === 'preview' ? 'is-on' : '') + '" data-notemode="preview">' + t('notes.preview') + '</button>' +
            '<button class="' + (state.noteMode === 'edit' ? 'is-on' : '') + '" data-notemode="edit">' + t('notes.edit') + '</button>' +
          '</div>' +
          '<button class="btn btn--sm" data-act="save">' + icon('check') + t('common.save') + '</button>' +
        '</div>' +
        '<div class="editor__body">' +
          (state.noteMode === 'edit'
            ? '<textarea class="editor__ta" id="noteTa" spellcheck="false">' + esc(draft) + '</textarea>'
            : '<div class="md">' + mdToHtml(draft) + '</div>') +
        '</div>' +
        '<div class="editor__foot"><span>' + note.path + '</span><span>·</span><span>' + words + ' ' + t('notes.words') + '</span>' +
          '<span>·</span><span>' + t('notes.updated') + ' ' + note.updated + '</span>' +
          '<span style="margin-left:auto;color:var(--green)">' + icon('check') + ' ' + t('notes.saved') + '</span></div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── AI records ───────────────────────── */
function aiHTML(){
  const sel = AIS.filter(a => a.id === state.aiId)[0] || AIS[0];
  const rows = AIS.map(a =>
    '<button class="row ' + (a.id === sel.id ? 'is-sel' : '') + '" data-ai="' + a.id + '">' +
      '<span class="row__i">' + icon(a.provider === 'Cursor' ? 'mouse-pointer-2' : a.provider === 'Codex' ? 'terminal' : 'sparkles') + '</span>' +
      '<span><span class="row__t">' + esc(a.title) + '</span>' +
        '<span class="row__m"><span>' + esc(a.provider) + '</span><span>·</span><span>' + a.msgs + ' ' + t('ai.msgs') + '</span></span></span>' +
      '<span class="row__r">' + esc(a.date.slice(5, 10)) + '</span>' +
    '</button>').join('');

  const body = sel.missing ? errorHTML() :
    '<div class="kv" style="margin-bottom:14px">' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.provider') + '</span><span class="kv__v">' + esc(sel.provider) + '</span></div>' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.model') + '</span><span class="kv__v">' + esc(sel.model) + '</span></div>' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.messages') + '</span><span class="kv__v num">' + sel.msgs + '</span></div>' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.date') + '</span><span class="kv__v">' + esc(sel.date) + '</span></div>' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.project') + '</span><span class="kv__v">' + esc(sel.project) + '</span></div>' +
      '<div class="kv__r"><span class="kv__k">' + t('ai.meta.path') + '</span><span class="kv__v">' + esc(sel.path) + '</span></div>' +
    '</div>' +
    '<div class="dt__sh">' + t('ai.summary') + '</div>' +
    '<div class="snippet" style="margin-bottom:16px">' + esc(sel.summary) + '</div>' +
    '<div class="dt__sh">' + t('ai.transcript') + '</div>' +
    sel.transcript.map(x => '<div class="turn ' + (x.role === 'user' ? 'turn--user' : '') + '">' +
      '<div class="turn__role">' + x.role + '</div><div class="turn__body md">' + mdToHtml(x.text) + '</div></div>').join('');

  return '<div class="view">' +
    '<div class="vh"><div><h1>' + t('ai.title') + '</h1><div class="sub">' + t('ai.sub') + '</div></div>' +
      '<div class="vh__a"><button class="btn btn--primary" data-act="capture">' + icon('plus') + t('common.capture') + '</button></div></div>' +
    '<div class="panes">' +
      '<div class="pane"><div class="pane__h"><span>' + AIS.length + ' ' + t('ai.title').toLowerCase() + '</span></div>' + rows + '</div>' +
      '<div class="pane"><div class="detail">' +
        '<h2 class="dt__title">' + esc(sel.title) + '</h2>' +
        '<div class="dt__meta"><span class="tag tag--blue">' + esc(sel.provider) + '</span>' +
          '<span>' + esc(sel.date) + '</span><span>·</span><span>' + sel.msgs + ' ' + t('ai.msgs') + '</span></div>' +
        '<div class="dt__acts">' +
          '<button class="btn btn--primary" data-act="open">' + icon('external-link') + t('common.open') + '</button>' +
          '<button class="btn" data-act="copy-path">' + icon('copy') + t('common.copyPath') + '</button>' +
        '</div>' + body +
      '</div></div>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── clipboard ───────────────────────── */
function clipHTML(){
  const sel = CLIPS.filter(c => c.id === state.clipId)[0] || CLIPS[0];
  const rows = CLIPS.map(c =>
    '<button class="row ' + (c.id === sel.id ? 'is-sel' : '') + '" data-clip="' + c.id + '">' +
      '<span class="row__i">' + icon(c.kind === 'image' ? 'image' : 'type') + '</span>' +
      '<span><span class="row__t">' + (c.sensitive ? t('clip.privacyNote') : esc(c.text.split('\n')[0])) + '</span>' +
        '<span class="row__m"><span>' + esc(c.app) + '</span><span>·</span><span>' + c.size + '</span>' +
        (c.sensitive ? '<span class="tag tag--yellow" style="height:14px">' + t('dash.privacy') + '</span>' : '') + '</span></span>' +
      '<span class="row__r">' + c.time + '</span>' +
    '</button>').join('');

  const body = sel.sensitive
    ? '<div class="errorbox" style="margin:0"><div class="errorbox__t" style="color:var(--yellow)">' + icon('shield') +
      t('clip.privacyNote') + '</div><p>' + t('clip.privacyHint') + '</p></div>'
    : (sel.kind === 'image'
      ? '<div class="snippet" style="display:grid;place-items:center;padding:34px 12px;color:var(--muted)">' + icon('image') + '<p style="margin:8px 0 0">' + esc(sel.text) + ' · 1440×900</p></div>'
      : '<div class="snippet">' + esc(sel.text) + '</div>');

  return '<div class="view">' +
    '<div class="vh"><div><h1>' + t('clip.title') + '</h1><div class="sub">' + t('clip.sub') + '</div></div>' +
      '<div class="vh__a"><span class="tag tag--green">' + icon('circle') + t('dash.on') + '</span></div></div>' +
    '<div class="panes">' +
      '<div class="pane"><div class="pane__h"><span>' + CLIPS.length + ' ' + t('clip.title').toLowerCase() + '</span>' +
        '<span class="spacer"></span><span>' + t('clip.monitor') + ' · 240</span></div>' + rows + '</div>' +
      '<div class="pane"><div class="detail">' +
        '<h2 class="dt__title">' + (sel.sensitive ? t('clip.privacyNote') : esc(sel.text.split('\n')[0]).slice(0, 90)) + '</h2>' +
        '<div class="dt__meta"><span class="tag">' + (sel.kind === 'image' ? 'image/png' : 'text/plain') + '</span>' +
          '<span>' + esc(sel.app) + '</span><span>·</span><span>' + sel.time + '</span></div>' +
        '<div class="dt__acts">' +
          (sel.sensitive ? '' :
            '<button class="btn btn--primary" data-act="copy">' + icon('copy') + t('clip.copy') + '</button>' +
            '<button class="btn" data-act="reveal">' + icon('file-code') + t('clip.raw') + '</button>') +
        '</div>' + body +
        '<div class="kv" style="margin-top:16px">' +
          '<div class="kv__r"><span class="kv__k">' + t('clip.meta.captured') + '</span><span class="kv__v">2026-11-12 ' + sel.time + ' ago</span></div>' +
          '<div class="kv__r"><span class="kv__k">' + t('clip.meta.source') + '</span><span class="kv__v">' + esc(sel.app) + '</span></div>' +
          '<div class="kv__r"><span class="kv__k">' + t('clip.meta.size') + '</span><span class="kv__v">' + sel.size + '</span></div>' +
          '<div class="kv__r"><span class="kv__k">' + t('clip.meta.hash') + '</span><span class="kv__v">' + sel.hash + '</span></div>' +
        '</div>' +
      '</div></div>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── settings ───────────────────────── */
function settingsHTML(){
  const group = SETTINGS.filter(g => g.id === state.settingsId)[0] || SETTINGS[0];

  const nav = SETTINGS.map(g =>
    '<button class="snav__i ' + (g.id === group.id ? 'is-on' : '') + '" data-snav="' + g.id + '">' +
    t('set.groups.' + g.id) + '</button>').join('');

  let content = '';
  if (group.rows && group.rows.type === 'keys'){
    content = '<div class="keys">' + KEYS.map(k =>
      '<div class="keys__r"><span>' + L(k.l) + '</span><span class="k">' +
      k.k.map(x => '<kbd>' + x + '</kbd>').join('') + '</span></div>').join('') + '</div>';
  } else {
    content = (group.rows || []).map((r, i) => {
      let ctl = '';
      const c = r.ctl || {};
      if (c.type === 'value') ctl = '<span class="fval">' + esc(c.value) + '</span>';
      else if (c.type === 'switch') ctl = '<button class="switch ' + (c.on ? 'is-on' : '') + '" data-toggle aria-label="toggle"></button>';
      else if (c.type === 'seg'){
        const opts = Array.isArray(c.options) ? c.options : (c.options[state.lang] || c.options.en);
        ctl = '<div class="seg">' + opts.map((o, j) =>
          '<button class="' + (j === c.on ? 'is-on' : '') + '" data-seg="' + i + ':' + j + '">' + o + '</button>').join('') + '</div>';
      }
      else if (c.type === 'input') ctl = '<input class="input" style="width:260px" value="' + esc(c.value) + '" spellcheck="false" />';
      else if (c.type === 'theme') ctl = '<div class="seg">' +
        '<button class="' + (state.theme === 'dark' ? 'is-on' : '') + '" data-set-theme="dark">Dark</button>' +
        '<button class="' + (state.theme === 'light' ? 'is-on' : '') + '" data-set-theme="light">Light</button></div>';
      else if (c.type === 'lang') ctl = '<div class="seg">' +
        '<button class="' + (state.lang === 'en' ? 'is-on' : '') + '" data-set-lang="en">English</button>' +
        '<button class="' + (state.lang === 'zh' ? 'is-on' : '') + '" data-set-lang="zh">中文</button></div>';

      if (r.act) ctl += '<button class="btn btn--sm" data-act="' + (r.act.toast || 'saved') + '">' +
        icon(r.act.icon) + L(r.act.label) + '</button>';

      return '<div class="frow"><div><div class="frow__l">' + L(r.label) +
        (r.note === 'warn' ? ' <span class="tag tag--yellow">' + t('dash.monitor') + '</span>' : '') +
        '</div><div class="frow__h">' + L(r.hint) + '</div></div>' +
        '<div class="frow__c">' + ctl + '</div></div>';
    }).join('');
  }

  return '<div class="view">' +
    '<div class="vh"><div><h1>' + t('set.title') + '</h1><div class="sub">' + t('set.sub') + '</div></div></div>' +
    '<div class="settings">' +
      '<div class="snav">' + nav + '</div>' +
      '<div class="sform"><h2 class="sform__h">' + t('set.groups.' + group.id) + '</h2>' +
        '<div class="sform__s">~/gitmemo/knowledge · main</div>' + content + '</div>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── render ───────────────────────── */
const VIEWS = {dashboard:dashHTML, search:searchHTML, notes:notesHTML, ai:aiHTML, clipboard:clipHTML, settings:settingsHTML};

function render(){
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  const viewHTML = (VIEWS[state.view] || dashHTML)();
  const html = sidebarHTML() +
    '<div class="main">' + toolbarHTML() + viewHTML + statusbarHTML() + '</div>';

  $('#app').innerHTML = html;
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  if (window.lucide) window.lucide.createIcons();

  if (focusId){
    const el = document.getElementById(focusId);
    if (el){
      el.focus();
      if (caret !== null && el.setSelectionRange){ try { el.setSelectionRange(caret, caret); } catch(e){} }
    }
  }
}

function go(view){
  if (state.view === view) return;
  state.view = view;
  if (view === 'search' && state.filter !== 'all') state.filter = 'all';
  render();
}

/* ───────────────────────── events ───────────────────────── */
document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-view],[data-act],[data-chip],[data-result],[data-note],[data-ai],[data-clip],[data-snav],[data-toggle],[data-seg],[data-set-theme],[data-set-lang],[data-notemode],[data-theme-toggle],[data-lang]');
  if (!el) return;
  const d = el.dataset;

  if (d.view){ go(d.view); return; }
  if (d.chip){ state.filter = d.chip; state.selResult = 0; render(); return; }
  if (d.result !== undefined){
    const list = filteredIndex();
    const res = list[Number(d.result)];
    if (res){
      state.selResult = Number(d.result);
      if (state.q.trim() || state.view === 'search'){ state.view = 'search'; }
    }
    if (d.goto === 'search'){ state.view = 'search'; state.q = ''; }
    render(); return;
  }
  if (d.note){ state.noteId = d.note; state.noteMode = 'preview'; render(); return; }
  if (d.ai){ state.aiId = d.ai; render(); return; }
  if (d.clip){ state.clipId = d.clip; render(); return; }
  if (d.snav){ state.settingsId = d.snav; render(); return; }
  if (d.notemode){
    if (state.noteMode === 'edit'){
      const ta = $('#noteTa');
      if (ta) state.noteDraft[state.noteId] = ta.value;
    }
    state.noteMode = d.notemode; render(); return;
  }
  if (d.toggle){ el.classList.toggle('is-on'); return; }
  if (d.seg){ toast('saved'); return; }
  if (d.setTheme){ state.theme = d.setTheme; render(); return; }
  if (d.setLang){ state.lang = d.setLang; render(); return; }
  if (d.themeToggle !== undefined && ev.target.closest('[data-theme-toggle]')){
    state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); return;
  }
  if (d.lang !== undefined && ev.target.closest('[data-lang]')){
    state.lang = state.lang === 'en' ? 'zh' : 'en'; render(); return;
  }

  if (d.act){
    switch (d.act){
      case 'capture': toast('capture'); break;
      case 'note': state.view = 'notes'; state.noteMode = 'edit'; render(); break;
      case 'sync': toast('sync'); break;
      case 'import': toast('capture'); break;
      case 'copy': toast('copy'); break;
      case 'copy-path': toast('copy'); break;
      case 'reveal': toast('reveal'); break;
      case 'open': toast('capture'); break;
      case 'reindex': toast('reindex'); break;
      case 'save': {
        const ta = $('#noteTa');
        if (ta) state.noteDraft[state.noteId] = ta.value;
        toast('saved');
        break;
      }
      default: toast('saved');
    }
  }
});

document.addEventListener('input', function(ev){
  if (ev.target.id === 'q'){
    state.q = ev.target.value;
    if (state.view !== 'search' && state.q.trim().length >= 1) state.view = 'search';
    state.selResult = 0;
    render();
  }
  if (ev.target.id === 'noteTa'){
    state.noteDraft[state.noteId] = ev.target.value;
  }
});

document.addEventListener('keydown', function(ev){
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); const q = $('#q'); if (q) q.focus(); }
  if (mod && ev.key.toLowerCase() === 'n'){ ev.preventDefault(); state.view = 'notes'; state.noteMode = 'edit'; render(); }
  if (mod && /^[1-6]$/.test(ev.key)){
    ev.preventDefault();
    const order = ['dashboard','search','notes','ai','clipboard','settings'];
    go(order[Number(ev.key) - 1]);
  }
  if (ev.key === 'Escape'){
    const q = $('#q');
    if (q){ q.value = ''; }
    state.q = ''; state.selResult = 0;
    if (state.view === 'search') render();
  }
});

/* boot */
render();
})();

</script>
</body>
</html>
